# PostgreSQL connection settings.
#
# On a typical macOS (Homebrew) or Linux setup where your user can connect to
# PostgreSQL without a password, you don't need to set anything. Otherwise,
# copy .env.example to .env and fill in DATABASE_USERNAME and DATABASE_PASSWORD.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV["DATABASE_PORT"] %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: onward_development

test:
  <<: *default
  database: onward_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
