# A new graduate whose résumé has a skills list and a degree, but no jobs or
# projects yet. Skills that are only listed get partial credit.
name: Jordan Ellis, with only a skills list, and the frontend posting
covers: [ skills_only_resume ]
today: "2026-11-26"
posting_from: lantern_frontend

resume:
  name: Jordan Ellis
  skills:
