  QA Automation Engineer, Northstar Ticketing

  Northstar sells tickets for concerts and theater in 40 cities. When a big show goes on sale, everything has to work, and you'll help make sure it does.

  In this role you will
  - Write and maintain tests for our web and mobile checkout
  - Work with developers to catch problems before release

  Requirements
  - 5+ years of experience in software QA
  - Selenium or Playwright
  - Python
  - API testing with Postman or a similar tool
  - Running tests in CI (Jenkins, GitHub Actions, or CircleCI)

  Nice to have
  - Mobile testing with Appium
  - Load testing with JMeter or k6

