  Customer Success Associate, Brightwater Software

  Are you a people person? Brightwater makes booking software for yoga studios, and we're looking for a friendly, curious team player to help our customers get the most out of it. You'll answer questions, run short training calls, and make every studio owner feel heard.

  About you
  - Excellent written and verbal communication
  - A self-starter who thrives in a fast-paced environment
  - Empathy, patience, and a positive attitude
  - Strong attention to detail
  - Comfortable with Salesforce
  - A team player who loves to learn

expected:
