"""
An ISO 8601-encoded date
"""
scalar ISO8601Date @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
An ISO 8601-encoded datetime
"""
scalar ISO8601DateTime @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
A job you've saved, applied to, or are interviewing for.
"""
type JobApplication {
  company: String!
  contacts: [Contact!]!
  createdAt: ISO8601DateTime!
  dateApplied: ISO8601Date
  id: ID!
  jobDescription: String
  location: String
  notes: String

  """
  Where the card sits in its column. Lower is higher up.
  """
  position: Int!
  postingUrl: String
  resumeVersion: String
  role: String!
  salaryRange: String

  """
  The board column the application is in.
  """
  stage: Stage!

  """
  Always the kind of the column the application is in.
  """
  status: JobApplicationStatus!
  updatedAt: ISO8601DateTime!
  workArrangement: WorkArrangement
}

"""
Fields for creating or updating a job application. Leave a field out to keep its current value.
"""
input JobApplicationInput {
  company: String

  """
  Replaces the linked contacts with exactly these.
  """
  contactIds: [ID!]
  dateApplied: ISO8601Date
  jobDescription: String
  location: String
  notes: String
  postingUrl: String
  resumeVersion: String
  role: String
  salaryRange: String

  """
  The board column to put the application in. Its status follows the column's kind.
  """
  stageId: ID
  workArrangement: WorkArrangement
}

"""
Where a job application stands.
"""
enum JobApplicationStatus {
  """
  Application sent.
  """
  APPLIED

  """
  In the interview process.
  """
  INTERVIEWING

  """
  Received an offer.
  """
  OFFER

  """
  Heard back with a no.
  """
  REJECTED

  """
  Saved to apply later.
  """
  SAVED
}

"""
Autogenerated return type of MoveJobApplication.
"""
type MoveJobApplicationPayload {
  errors: [UserError!]!
  jobApplication: JobApplication
}

type Mutation {
  """
  Adds a contact.
  """
  createContact(input: ContactInput!): CreateContactPayload!

  """
  Adds a job application.
  """
  createJobApplication(input: JobApplicationInput!): CreateJobApplicationPayload!

  """
  Adds a column to the end of the board.
  """
  createStage(input: StageInput!): CreateStagePayload!

  """
  Deletes a contact.
  """
  deleteContact(id: ID!): DeleteContactPayload!

  """
  Deletes a job application.
  """
  deleteJobApplication(id: ID!): DeleteJobApplicationPayload!

  """
  Deletes an empty column.
  """
  deleteStage(id: ID!): DeleteStagePayload!

  """
  Moves an application to a board column and spot, like dragging a card.
  """
  moveJobApplication(
    id: ID!

    """
    Where in the column, 0 is the top. Defaults to the top.
    """
    position: Int
    stageId: ID!
  ): MoveJobApplicationPayload!

  """
  Puts the board columns in a new order, left to right.
  """
  reorderStages(
    """
    Every column id, in the new order.
    """
    ids: [ID!]!
  ): ReorderStagesPayload!

  """
  Signs in with an email address and password.
  """
  signIn(emailAddress: String!, password: String!): SignInPayload!

  """
  Signs out of this browser.
  """
  signOut: SignOutPayload!

  """
  Creates an account and signs in.
  """
  signUp(emailAddress: String!, password: String!, passwordConfirmation: String!): SignUpPayload!

  """
  Changes a contact.
  """
  updateContact(id: ID!, input: ContactInput!): UpdateContactPayload!

  """
  Changes a job application, like moving it to a new status.
  """
  updateJobApplication(id: ID!, input: JobApplicationInput!): UpdateJobApplicationPayload!

  """
  Renames a column or changes what kind of column it is.
  """
  updateStage(id: ID!, input: StageInput!): UpdateStagePayload!
}

type Query {
  contact(id: ID!): Contact!

  """
  Your contacts, alphabetically.
  """
  contacts: [Contact!]!
  jobApplication(id: ID!): JobApplication!

  """
  Your job applications, most recently updated first.
  """
  jobApplications(status: JobApplicationStatus): [JobApplication!]!

  """
  The signed-in person, or null when signed out.
  """
  me: User

  """
  Your board columns, left to right.
  """
  stages: [Stage!]!
}

"""
Autogenerated return type of ReorderStages.
"""
type ReorderStagesPayload {
  stages: [Stage!]!
}

"""
Autogenerated return type of SignIn.
"""
type SignInPayload {
  errors: [UserError!]!
  user: User
}

"""
Autogenerated return type of SignOut.
"""
type SignOutPayload {
  success: Boolean!
}

"""
Autogenerated return type of SignUp.
"""
type SignUpPayload {
  errors: [UserError!]!
  user: User
}

"""
A column on your job board, like "Phone screen".
"""
type Stage {
  id: ID!

  """
  The cards in this column, top to bottom.
  """
  jobApplications: [JobApplication!]!

  """
  What this column means. Applications in it get this status.
  """
  kind: JobApplicationStatus!
  name: String!

  """
  Where the column sits on the board, starting at 0.
  """
  position: Int!
}

"""
Fields for creating or updating a board column. Leave a field out to keep its current value.
"""
input StageInput {
  kind: JobApplicationStatus
  name: String
}

