type StudyStats {
  """
  All-time minutes per topic, most first.
  """
  byTopic: [TopicMinutes!]!
  minutesThisMonth: Int!

  """
  Since Monday.
  """
  minutesThisWeek: Int!
  minutesTotal: Int!

  """
  Minutes per week for the last 12 weeks, oldest first.
  """
  weeks: [WeekMinutes!]!
}

"""
Today's goals and nudges, for the Today strip above the board.
"""
type Today {
  """
  Today's date on your clock.
  """
  date: ISO8601Date!

  """
  Today's goals, in your order.
  """
  goals: [GoalProgress!]!

  """
  Whether you've set up any goals at all.
  """
  hasGoals: Boolean!

  """
  Up to 3.
  """
  nudges: [Nudge!]!

  """
  Whether every one of today's goals is done.
  """
  perfect: Boolean!

  """
  Perfect days in a row. Days with no goals are skipped.
  """
  perfectStreak: Int!

  """
  True when you have goals but none for today, like weekday goals on a Saturday.
  """
  restDay: Boolean!
}

type TopicMinutes {
  minutes: Int!
  topic: String!
}

