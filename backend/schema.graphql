type Mutation {
  """
  Adds a step to one interview round's checklist.
  """
  addChecklistItem(interviewRoundId: ID!, text: String!): AddChecklistItemPayload!

  """
  Adds a contact.
  """
  createContact(input: ContactInput!): CreateContactPayload!

  """
  Adds an action you can log, like "Went to a meetup".
  """
  createCustomAction(category: ActivityCategory!, name: String!): CreateCustomActionPayload!

  """
  Adds a daily goal, like "Apply to 1 job".
  """
  createDailyGoal(
    """
    Required for CUSTOM goals.
    """
    customActionId: ID
    kind: DailyGoalKind!
    target: Int!
    weekdaysOnly: Boolean = false
  ): CreateDailyGoalPayload!

  """
  Adds a job application.
  """
  createJobApplication(input: JobApplicationInput!): CreateJobApplicationPayload!

  """
  Adds a question to your question bank.
  """
  createQuestion(prompt: String!): CreateQuestionPayload!

  """
  Adds a column to the end of the board.
  """
  createStage(input: StageInput!): CreateStagePayload!

  """
  Adds a story to your story bank.
  """
  createStory(input: StoryInput!): CreateStoryPayload!

  """
  Deletes something you logged by mistake. Board activity can't be deleted.
  """
  deleteActivity(id: ID!): DeleteActivityPayload!

  """
  Removes a step from one interview round's checklist.
  """
  deleteChecklistItem(id: ID!): DeleteChecklistItemPayload!

  """
  Deletes a contact.
  """
  deleteContact(id: ID!): DeleteContactPayload!

  """
  Removes a custom action and its goal, if it has one. Times you logged it stay in your history.
  """
  deleteCustomAction(id: ID!): DeleteCustomActionPayload!

  """
  Removes a daily goal. Perfect days you already had stay.
  """
  deleteDailyGoal(id: ID!): DeleteDailyGoalPayload!

  """
  Deletes a job application.
  """
  deleteJobApplication(id: ID!): DeleteJobApplicationPayload!

  """
  Removes a question from your question bank.
  """
  deleteQuestion(id: ID!): DeleteQuestionPayload!

  """
  Deletes an empty column.
  """
  deleteStage(id: ID!): DeleteStagePayload!

  """
  Deletes a story. Your practice history stays in your streak.
  """
  deleteStory(id: ID!): DeleteStoryPayload!

  """
  Hides a nudge. Snoozing hides it for a week; dismissing hides it until things change.
  """
  dismissNudge(key: String!, snooze: Boolean = false): DismissNudgePayload!

  """
  Logs something you did today, like a networking message, a coffee chat, or one of your custom actions.
  """
  logActivity(
    contactId: ID

    """
    Required when kind is CUSTOM.
    """
    customActionId: ID
    jobApplicationId: ID
    kind: ActivityKind!
    note: String
  ): LogActivityPayload!

  """
  Records a practice rep: answering a question out loud with one of your stories.
  """
  logPractice(
    questionId: ID
    rating: PracticeRating!

    """
    How long the answer took, if you used the timer.
    """
    seconds: Int
    storyId: ID
  ): LogPracticePayload!

  """
  Records a study session from the timer. Sessions under 10 minutes aren't saved.
  """
  logStudySession(
    minutes: Int!

    """
    For time you studied away from the timer. Defaults to today, and can be up to a week back.
    """
    studiedOn: ISO8601Date
    topic: String!
  ): LogStudySessionPayload!

  """
  Moves an application to a board column and spot, like dragging a card.
  """
  moveJobApplication(
    id: ID!

    """
    Where in the column, 0 is the top. Defaults to the top.
    """
    position: Int
    stageId: ID!
  ): MoveJobApplicationPayload!

  """
  Fetches fresh LeetCode and GitHub data now, instead of waiting for the next automatic refresh.
  """
  refreshIntegrations: RefreshIntegrationsPayload!

  """
  Puts your goals in a new order. Pass every goal's id, first to last.
  """
  reorderDailyGoals(ids: [ID!]!): ReorderDailyGoalsPayload!

  """
  Puts the board columns in a new order, left to right.
  """
  reorderStages(
    """
    Every column id, in the new order.
    """
    ids: [ID!]!
  ): ReorderStagesPayload!

  """
  Checks or unchecks a prep checklist item.
  """
  setChecklistItemDone(done: Boolean!, id: ID!): SetChecklistItemDonePayload!

  """
  Signs in with an email address and password.
  """
  signIn(emailAddress: String!, password: String!): SignInPayload!

  """
  Signs out of this browser.
  """
  signOut: SignOutPayload!

  """
  Creates an account and signs in.
  """
  signUp(emailAddress: String!, password: String!, passwordConfirmation: String!): SignUpPayload!

  """
  Replaces the checklist new interview rounds start with. Existing rounds keep theirs.
  """
  updateChecklistTemplate(
    """
    Every line, in order. Blank lines are skipped.
    """
    items: [String!]!
  ): UpdateChecklistTemplatePayload!

  """
  Changes a contact.
  """
  updateContact(id: ID!, input: ContactInput!): UpdateContactPayload!

  """
  Renames a custom action or changes its category. Past activity follows along.
  """
  updateCustomAction(category: ActivityCategory, id: ID!, name: String): UpdateCustomActionPayload!

  """
  Changes a goal's number or whether it's for weekdays only.
  """
  updateDailyGoal(id: ID!, target: Int, weekdaysOnly: Boolean): UpdateDailyGoalPayload!

  """
  Turns the software engineering track on or off and connects LeetCode and GitHub. Leave a field out to keep it.
  """
  updateEngineeringSettings(
    engineeringTrack: Boolean

    """
    Send an empty string to remove the saved token.
    """
    githubToken: String
    githubUsername: String
    leetcodeUsername: String
  ): UpdateEngineeringSettingsPayload!

  """
  Sets (or clears) when an interview round happens, for the countdown.
  """
  updateInterviewRound(id: ID!, scheduledAt: ISO8601DateTime): UpdateInterviewRoundPayload!

  """
  Changes a job application, like moving it to a new status.
  """
  updateJobApplication(id: ID!, input: JobApplicationInput!): UpdateJobApplicationPayload!

  """
  Rewords a question in your question bank.
  """
  updateQuestion(id: ID!, prompt: String!): UpdateQuestionPayload!

  """
  Renames a column or changes what kind of column it is.
  """
  updateStage(id: ID!, input: StageInput!): UpdateStagePayload!

  """
  Changes a story in your story bank.
  """
  updateStory(id: ID!, input: StoryInput!): UpdateStoryPayload!

  """
  Sets your time zone, so days and streaks follow your clock. The app sends this automatically.
  """
  updateTimeZone(
    """
    An IANA time zone, like America/Toronto.
    """
    timeZone: String!
  ): UpdateTimeZonePayload!
}

"""
A gentle reminder about something that might need you.
"""
type Nudge {
  contact: Contact
  interviewRound: InterviewRound
  jobApplication: JobApplication

  """
  Pass this to dismissNudge.
  """
  key: String!
  kind: NudgeKind!

  """
  For quiet applications and contacts: the last day anything happened.
