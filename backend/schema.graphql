"""
Something you did for your job hunt on a given day.
"""
type Activity {
  """
  True when it came from moving a card on the board, false when you logged it.
  """
  automatic: Boolean!
  category: ActivityCategory!
  contact: Contact
  createdAt: ISO8601DateTime!

  """
  Set when kind is CUSTOM.
  """
  customAction: CustomAction
  id: ID!
  jobApplication: JobApplication
  kind: ActivityKind!
  note: String

  """
  The day it happened, on your clock.
  """
  occurredOn: ISO8601Date!
}

"""
Which part of the job hunt an activity belongs to.
"""
enum ActivityCategory {
  APPLYING
  INTERVIEW_PREP
  MATERIALS
  NETWORKING
}

"""
Something you did for your job hunt.
"""
enum ActivityKind {
  """
  Sent an application. Recorded from the board.
  """
  APPLICATION_SENT

  """
  Had a coffee chat or informational interview.
  """
  COFFEE_CHAT

  """
  Did one of your own custom actions. See customAction.
  """
  CUSTOM

  """
  Followed up on an application or conversation.
  """
  FOLLOW_UP

  """
  Landed an interview. Recorded from the board.
  """
  INTERVIEW

  """
  Practiced answering an interview question.
  """
  INTERVIEW_PRACTICE

  """
  Finished an interview round's prep checklist.
  """
  INTERVIEW_PREPPED

  """
  Submitted LeetCode solutions that day. Synced from LeetCode.
  """
  LEETCODE

  """
  Sent a networking message.
  """
  NETWORKING_MESSAGE

  """
  Got an offer. Recorded from the board.
  """
  OFFER

  """
  Heard back with a no. Recorded from the board.
  """
  REJECTION

  """
  Finished a study session.
  """
  STUDY_SESSION

  """
  Tailored a resume or cover letter.
  """
  TAILORED_MATERIALS
}

