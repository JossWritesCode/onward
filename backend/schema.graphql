"""
A column on your job board, like "Phone screen".
"""
type Stage {
  id: ID!

  """
  The cards in this column, top to bottom.
  """
  jobApplications: [JobApplication!]!

  """
  What this column means. Applications in it get this status.
  """
  kind: JobApplicationStatus!
  name: String!

  """
  Where the column sits on the board, starting at 0.
  """
  position: Int!
}

"""
Fields for creating or updating a board column. Leave a field out to keep its current value.
"""
input StageInput {
  kind: JobApplicationStatus
  name: String
}

"""
Your run of active days in a row.
"""
type Streak {
  """
  Whether you've done something today yet.
  """
  activeToday: Boolean!

  """
  Days in a row, counting today once you've done something.
  """
  current: Int!

  """
  Freezes ready to cover a missed day (up to 2).
  """
  freezes: Int!

  """
  Missed days a freeze covered.
  """
  frozenDates: [ISO8601Date!]!
  longest: Int!
}

