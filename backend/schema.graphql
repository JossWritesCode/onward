"""
Someone with an Onward account.
"""
type User {
  createdAt: ISO8601DateTime!
  emailAddress: String!

  """
  Whether the software engineering track is on.
  """
  engineeringTrack: Boolean!

  """
  Whether a GitHub token is saved. The token itself is never sent back.
  """
  githubConnected: Boolean!
  githubUsername: String
  id: ID!
  leetcodeUsername: String

  """
  Your time zone, like America/Toronto.
  """
  timeZone: String!
}

"""
A problem with what was submitted, like a missing company name.
"""
type UserError {
  """
  The input field the problem is about, in camelCase. Null when it applies to the whole form.
  """
  field: String

  """
  A sentence that can be shown to the person.
  """
  message: String!
}

type WeekMinutes {
  minutes: Int!

  """
  The Monday the week starts on.
  """
  weekStart: ISO8601Date!
}

"""
Where the work happens.
"""
enum WorkArrangement {
  """
  Partly in the office, partly remote.
  """
  HYBRID

  """
  In the office.
  """
  ONSITE

  """
  Fully remote.
  """
  REMOTE
}
