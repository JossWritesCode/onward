Autogenerated return type of UpdateContact.
"""
type UpdateContactPayload {
  contact: Contact
  errors: [UserError!]!
}

"""
Autogenerated return type of UpdateJobApplication.
"""
type UpdateJobApplicationPayload {
  errors: [UserError!]!
  jobApplication: JobApplication
}

"""
Autogenerated return type of UpdateStage.
"""
type UpdateStagePayload {
  errors: [UserError!]!
  stage: Stage
}

"""
Someone with an Onward account.
"""
type User {
  createdAt: ISO8601DateTime!
  emailAddress: String!
  id: ID!
}

"""
A problem with what was submitted, like a missing company name.
"""
type UserError {
  """
  The input field the problem is about, in camelCase. Null when it applies to the whole form.
  """
  field: String

  """
  A sentence that can be shown to the person.
  """
  message: String!
}

"""
Where the work happens.
"""
enum WorkArrangement {
  """
  Partly in the office, partly remote.
  """
  HYBRID

  """
  In the office.
  """
  ONSITE

  """
  Fully remote.
  """
  REMOTE
}
