"""
Someone you know or have reached out to during your job hunt.
"""
type Contact {
  company: String
  createdAt: ISO8601DateTime!
  email: String
  id: ID!
  jobApplications: [JobApplication!]!
  lastContactedOn: ISO8601Date
  linkedinUrl: String
  name: String!
  notes: String
  phone: String
  title: String
  updatedAt: ISO8601DateTime!
}

"""
Fields for creating or updating a contact. Leave a field out to keep its current value.
"""
input ContactInput {
  company: String
  email: String

  """
  Replaces the linked job applications with exactly these.
  """
  jobApplicationIds: [ID!]
  lastContactedOn: ISO8601Date
  linkedinUrl: String
  name: String
  notes: String
  phone: String
  title: String
}

"""
Autogenerated return type of CreateContact.
"""
type CreateContactPayload {
  contact: Contact
  errors: [UserError!]!
}

"""
Autogenerated return type of CreateJobApplication.
"""
type CreateJobApplicationPayload {
  errors: [UserError!]!
  jobApplication: JobApplication
}

"""
Autogenerated return type of DeleteContact.
"""
type DeleteContactPayload {
  """
  The id of the deleted contact.
  """
  id: ID!
}

"""
Autogenerated return type of DeleteJobApplication.
"""
type DeleteJobApplicationPayload {
  """
  The id of the deleted application.
  """
  id: ID!
}

"""
An ISO 8601-encoded date
"""
scalar ISO8601Date

"""
An ISO 8601-encoded datetime
"""
scalar ISO8601DateTime

"""
A job you've saved, applied to, or are interviewing for.
"""
type JobApplication {
  company: String!
  contacts: [Contact!]!
  createdAt: ISO8601DateTime!
  dateApplied: ISO8601Date
  id: ID!
  jobDescription: String
  location: String
  notes: String
  postingUrl: String
  resumeVersion: String
  role: String!
  salaryRange: String
  status: JobApplicationStatus!
  updatedAt: ISO8601DateTime!
  workArrangement: WorkArrangement
}

"""
Fields for creating or updating a job application. Leave a field out to keep its current value.
"""
input JobApplicationInput {
  company: String

  """
  Replaces the linked contacts with exactly these.
  """
  contactIds: [ID!]
  dateApplied: ISO8601Date
  jobDescription: String
  location: String
  notes: String
  postingUrl: String
  resumeVersion: String
  role: String
  salaryRange: String
  status: JobApplicationStatus
  workArrangement: WorkArrangement
}

"""
Where a job application stands.
"""
enum JobApplicationStatus {
  """
  Application sent.
  """
  APPLIED

  """
  In the interview process.
  """
  INTERVIEWING

  """
  Received an offer.
  """
  OFFER

  """
  Heard back with a no.
  """
  REJECTED

  """
  Saved to apply later.
  """
  SAVED
}

type Mutation {
  """
  Adds a contact.
  """
  createContact(input: ContactInput!): CreateContactPayload!

  """
  Adds a job application.
  """
  createJobApplication(input: JobApplicationInput!): CreateJobApplicationPayload!

  """
  Deletes a contact.
  """
  deleteContact(id: ID!): DeleteContactPayload!

  """
  Deletes a job application.
  """
  deleteJobApplication(id: ID!): DeleteJobApplicationPayload!

  """
  Signs in with an email address and password.
  """
  signIn(emailAddress: String!, password: String!): SignInPayload!

  """
  Signs out of this browser.
  """
  signOut: SignOutPayload!

  """
  Creates an account and signs in.
  """
  signUp(emailAddress: String!, password: String!, passwordConfirmation: String!): SignUpPayload!

  """
  Changes a contact.
  """
  updateContact(id: ID!, input: ContactInput!): UpdateContactPayload!

  """
  Changes a job application, like moving it to a new status.
  """
  updateJobApplication(id: ID!, input: JobApplicationInput!): UpdateJobApplicationPayload!
}

type Query {
  contact(id: ID!): Contact!

  """
  Your contacts, alphabetically.
  """
  contacts: [Contact!]!
  jobApplication(id: ID!): JobApplication!

  """
  Your job applications, most recently updated first.
  """
  jobApplications(status: JobApplicationStatus): [JobApplication!]!

  """
  The signed-in person, or null when signed out.
  """
  me: User
}

"""
Autogenerated return type of SignIn.
"""
type SignInPayload {
  errors: [UserError!]!
  user: User
}

"""
Autogenerated return type of SignOut.
"""
type SignOutPayload {
  success: Boolean!
}

"""
Autogenerated return type of SignUp.
"""
type SignUpPayload {
  errors: [UserError!]!
  user: User
}

"""
Autogenerated return type of UpdateContact.
"""
type UpdateContactPayload {
  contact: Contact
  errors: [UserError!]!
}

"""
Autogenerated return type of UpdateJobApplication.
"""
type UpdateJobApplicationPayload {
  errors: [UserError!]!
  jobApplication: JobApplication
}

"""
Someone with an Onward account.
"""
type User {
  createdAt: ISO8601DateTime!
  emailAddress: String!
  id: ID!
}

"""
A problem with what was submitted, like a missing company name.
"""
type UserError {
  """
  The input field the problem is about, in camelCase. Null when it applies to the whole form.
  """
  field: String

  """
  A sentence that can be shown to the person.
  """
  message: String!
}

"""
Where the work happens.
"""
enum WorkArrangement {
  """
  Partly in the office, partly remote.
  """
  HYBRID

  """
  In the office.
  """
  ONSITE

  """
  Fully remote.
  """
  REMOTE
}
