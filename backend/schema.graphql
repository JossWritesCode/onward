"""
Something you did for your job hunt on a given day.
"""
type Activity {
  """
  True when it came from moving a card on the board, false when you logged it.
  """
  automatic: Boolean!
  category: ActivityCategory!
  contact: Contact
  createdAt: ISO8601DateTime!
  id: ID!
  jobApplication: JobApplication
  kind: ActivityKind!
  note: String

  """
  The day it happened, on your clock.
  """
  occurredOn: ISO8601Date!
}

"""
Which part of the job hunt an activity belongs to.
"""
enum ActivityCategory {
  APPLYING
  INTERVIEW_PREP
  MATERIALS
  NETWORKING
}

"""
Something you did for your job hunt.
"""
enum ActivityKind {
  """
  Sent an application. Recorded from the board.
  """
  APPLICATION_SENT

  """
  Had a coffee chat or informational interview.
  """
  COFFEE_CHAT

  """
  Followed up on an application or conversation.
  """
  FOLLOW_UP

  """
  Landed an interview. Recorded from the board.
  """
  INTERVIEW

  """
  Sent a networking message.
  """
  NETWORKING_MESSAGE

  """
  Got an offer. Recorded from the board.
  """
  OFFER

  """
  Heard back with a no. Recorded from the board.
  """
  REJECTION

  """
  Tailored a resume or cover letter.
  """
  TAILORED_MATERIALS
}

"""
Someone you know or have reached out to during your job hunt.
"""
type Contact {
  company: String
  createdAt: ISO8601DateTime!
  email: String
  id: ID!
  jobApplications: [JobApplication!]!
  lastContactedOn: ISO8601Date
  linkedinUrl: String
  name: String!
  notes: String
  phone: String
  title: String
  updatedAt: ISO8601DateTime!
}

"""
Fields for creating or updating a contact. Leave a field out to keep its current value.
"""
input ContactInput {
  company: String
  email: String

  """
  Replaces the linked job applications with exactly these.
  """
  jobApplicationIds: [ID!]
  lastContactedOn: ISO8601Date
  linkedinUrl: String
  name: String
  notes: String
  phone: String
  title: String
}

"""
Autogenerated return type of CreateContact.
"""
type CreateContactPayload {
  contact: Contact
  errors: [UserError!]!
}

"""
Autogenerated return type of CreateJobApplication.
"""
type CreateJobApplicationPayload {
  errors: [UserError!]!
  jobApplication: JobApplication
}

"""
Autogenerated return type of CreateStage.
"""
type CreateStagePayload {
  errors: [UserError!]!
  stage: Stage
}

