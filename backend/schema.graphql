"""
Something you want to do every day (or every weekday).
"""
type DailyGoal {
  """
  False for LeetCode and GitHub goals while the engineering track is off. They don't count until it's back on.
  """
  available: Boolean!

  """
  Set for custom goals.
  """
  customAction: CustomAction
  id: ID!
  kind: DailyGoalKind!
  maxTarget: Int!
  minTarget: Int!

  """
  How many (or, for study, how many minutes) count as done.
  """
  target: Int!

  """
  True when the goal skips Saturdays and Sundays.
  """
  weekdaysOnly: Boolean!
}

"""
What a daily goal counts.
"""
enum DailyGoalKind {
  """
  Applications sent (cards moved into an applied column).
  """
  APPLICATIONS

  """
  Times you logged one of your custom actions.
  """
  CUSTOM

  """
  GitHub contributions. Engineering track only.
  """
  GITHUB

  """
  Different LeetCode problems solved. Engineering track only.
  """
  LEETCODE

  """
  Resumes or cover letters tailored.
  """
  MATERIALS

  """
  Networking messages, coffee chats, and follow-ups.
  """
  NETWORKING

  """
  Interview questions practiced.
  """
  PRACTICE

  """
  Minutes studied with the study timer or added by hand.
  """
  STUDY
}

