# Render Blueprint: one web service (Rails serving the API and the React app)
# and one PostgreSQL database. See "Putting Onward online" in the README.
#
# Cost: the free web service ($0, sleeps after 15 minutes without visitors)
# plus the smallest paid database ($6/month, keeps your data with backups).
services:
  - type: web
    name: onward
    runtime: ruby
    plan: free
    buildCommand: backend/bin/render-build
    startCommand: cd backend && bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: NODE_VERSION
        value: "22"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: onward-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      # Encrypt GitHub tokens. Never change these after the first deploy, or
      # saved tokens can't be read anymore.
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
      # Who can sign up: "invite" (invite codes only) or "open" (anyone).
      - key: SIGNUPS
        value: invite
      # Your email. This account can always sign up and can make invite codes.
      - key: OWNER_EMAIL
        sync: false
      # Email for password reset links. Leave these empty to skip password
      # reset for now; see the README for setting up Gmail.
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: onward-db
    databaseName: onward
    plan: 0.1c-256mb
    diskSizeGB: 1
